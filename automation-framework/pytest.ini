[pytest]

# Location where tests exist
testpaths =
    tests
    api/tests


# Test file naming convention
python_files =
    test_*.py


# Test class naming convention
python_classes =
    Test*


# Test function naming convention
python_functions =
    test_*


# Default execution options
addopts =
    -v
    --html=reports/test_report.html
    --self-contained-html


# Custom markers
markers =
    smoke: Smoke tests for deployment validation
    regression: Full regression test suite
    sanity: Sanity tests for critical functionality
    api: API automation tests
    performance: Browser performance tests
