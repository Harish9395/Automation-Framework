name: ECS API Tests

on:
  workflow_call:
  workflow_dispatch:
  
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  api-test:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: automation-framework

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation-framework/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Reports Directory
        run: |
          mkdir -p reports

      - name: Validate Application URL
        env:
          APP_URL: ${{ secrets.APP_URL }}

        run: |
          test -n "$APP_URL" || {
            echo "APP_URL secret is missing"
            exit 1
          }

          echo "Application URL configured"


      - name: Run API Smoke Tests
        env:
          APP_URL: ${{ secrets.APP_URL }}

        run: |
          pytest \
            api/tests \
            -m "api and smoke" \
            -v \
            --tb=short \
            --junitxml=reports/api-results.xml \
            --html=reports/api-report.html \
            --self-contained-html


      - name: Upload API Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: automation-framework/reports/
          if-no-files-found: warn

      - name: Publish API Summary
        if: always()

        run: |
          {
            echo "## ECS API Smoke Test Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Test Type | API Smoke |"
            echo "| Branch | $GITHUB_REF_NAME |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
