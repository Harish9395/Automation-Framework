name: ECS Sauce Labs Automation

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecs-automation-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NAME: ECS-Smoke-${{ github.run_number }}
  BUILD_ID: ${{ github.run_id }}
  GIT_BRANCH: ${{ github.ref_name }}
  GIT_COMMIT: ${{ github.sha }}
  PYTHONUNBUFFERED: "1"

jobs:
  automation-test:
    name: Smoke Test - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser:
          - chrome
          - firefox
          - edge

    defaults:
      run:
        working-directory: automation-framework

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: automation-framework/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Project Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f

      - name: Validate Sauce Labs Credentials
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: |
          test -n "$SAUCE_USERNAME" || exit 1
          test -n "$SAUCE_ACCESS_KEY" || exit 1
          echo "Sauce Labs credentials validated"

      - name: Verify Application Connectivity
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          test -n "$APP_URL" || exit 1

          curl \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --fail \
            --silent \
            --show-error \
            --location \
            "$APP_URL"

          echo "Application reachable"

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Execute Smoke Tests on Sauce Labs
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          APP_URL: ${{ secrets.APP_URL }}

          BROWSER: ${{ matrix.browser }}

          BUILD_NAME: ${{ env.BUILD_NAME }}
          BUILD_ID: ${{ env.BUILD_ID }}
          GIT_BRANCH: ${{ env.GIT_BRANCH }}
          GIT_COMMIT: ${{ env.GIT_COMMIT }}

          TEST_NAME: Flask ECS Smoke Test
          TEST_TYPE: Smoke

        run: |
          pytest \
            -m smoke \
            -v \
            --tb=short \
            --junitxml=reports/smoke-${{ matrix.browser }}.xml

      - name: Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-smoke-${{ matrix.browser }}
          path: automation-framework/reports/*.xml
          if-no-files-found: warn

      - name: Upload Automation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-smoke-report-${{ matrix.browser }}
          path: automation-framework/reports/
          if-no-files-found: warn
          
      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-screenshots-${{ matrix.browser }}
          path: automation-framework/reports/*.png
          if-no-files-found: warn

      - name: Publish Workflow Summary
        if: always()
        run: |
          {
            echo "## Sauce Labs Smoke Test Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Test Type | Smoke |"
            echo "| Build | $BUILD_NAME |"
            echo "| Browser | ${{ matrix.browser }} |"
            echo "| Branch | $GIT_BRANCH |"
            echo "| Commit | $GIT_COMMIT |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"


  regression-test:
    name: Regression Tests
    needs: automation-test
    if: success()

    uses: ./.github/workflows/regression.yml
    secrets: inherit
