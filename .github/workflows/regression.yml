name: ECS Sauce Labs Regression Tests

on:
  workflow_call:

  workflow_dispatch:

  # schedule:
  #   - cron: "0 2 * * *"

permissions:
  contents: read

env:
  BUILD_NAME: ECS-Regression-${{ github.run_number }}
  BUILD_ID: ${{ github.run_id }}
  GIT_BRANCH: ${{ github.ref_name }}
  GIT_COMMIT: ${{ github.sha }}
  PYTHONUNBUFFERED: "1"

jobs:
  regression-test:
    name: Regression Test - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chrome
          - firefox
          - edge

    defaults:
      run:
        working-directory: automation-framework

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: automation-framework/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Reports Directory
        run: |
          mkdir -p reports

      - name: Validate Sauce Labs Credentials
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: |
          test -n "$SAUCE_USERNAME" || { echo "SAUCE_USERNAME missing"; exit 1; }
          test -n "$SAUCE_ACCESS_KEY" || { echo "SAUCE_ACCESS_KEY missing"; exit 1; }

          echo "Sauce Labs credentials validated"

      - name: Run Regression Tests on Sauce Labs
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          APP_URL: ${{ secrets.APP_URL }}

          BROWSER: ${{ matrix.browser }}

          BUILD_NAME: ${{ env.BUILD_NAME }}
          BUILD_ID: ${{ env.BUILD_ID }}
          GIT_BRANCH: ${{ env.GIT_BRANCH }}
          GIT_COMMIT: ${{ env.GIT_COMMIT }}

          TEST_NAME: Flask ECS Regression Test
          TEST_TYPE: Regression
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

        run: |
          pytest \
            -m regression \
            -v \
            --tb=short \
            --junitxml=reports/results-${{ matrix.browser }}.xml

      - name: Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-regression-${{ matrix.browser }}
          path: automation-framework/reports/results-${{ matrix.browser }}.xml
          if-no-files-found: warn

      - name: Upload Regression Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ matrix.browser }}
          path: automation-framework/reports/
          if-no-files-found: warn

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-screenshots-${{ matrix.browser }}
          path: automation-framework/reports/*.png
          if-no-files-found: warn

      - name: Publish Regression Summary
        if: always()
        run: |
          {
            echo "## Sauce Labs Regression Test Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Test Type | Regression |"
            echo "| Browser | ${{ matrix.browser }} |"
            echo "| Build | $BUILD_NAME |"
            echo "| Branch | $GIT_BRANCH |"
            echo "| Commit | $GIT_COMMIT |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
